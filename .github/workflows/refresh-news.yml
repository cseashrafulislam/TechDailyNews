name: Refresh TechDaily News

on:
  schedule:
    # Bangladesh time: 06:17, 12:17, 18:17, 00:17
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/refresh-news.yml'

permissions:
  contents: write

concurrency:
  group: techdaily-news-updates
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Fetch technology headlines from public RSS feeds
        run: python scripts/update_news.py
      - name: Generate SEO landing pages and sitemap
        run: python scripts/generate_seo.py
      - name: Check SEO pages
        run: python -c "from pathlib import Path; assert Path('sitemap.xml').exists() and Path('category/ai/index.html').exists() and Path('feed.xml').exists()"
      - name: Validate JSON
        run: python -m json.tool data/news.json > /dev/null
      - name: Commit the updated news edition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json category/ sitemap.xml feed.xml
          if git diff --staged --quiet; then
            echo "No news data changes"
          else
            git commit -m "chore: update global tech news edition"
            git push origin HEAD:main
          fi
